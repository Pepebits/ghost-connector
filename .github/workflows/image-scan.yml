# Weekly scan of the PUBLISHED image: new vulnerabilities appear in the base
# image and dependencies even when the code doesn't change. If any HIGH or
# CRITICAL one has a fix, it opens (or updates) an issue: the cue to cut a
# patch release, which rebuilds the image with the fixes. Once a scan is clean
# again (that release went out), the issue is closed.
name: Image scan

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: pepebits/ghost-connector:latest
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table
          output: trivy.txt
          exit-code: '1'
      - if: steps.trivy.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ ! -s trivy.txt ]; then echo "::error::The scan itself failed (no report)"; exit 1; fi
          title='Published Docker image has fixable vulnerabilities'
          {
            echo "The weekly scan of \`pepebits/ghost-connector:latest\` found HIGH/CRITICAL vulnerabilities that already have a fix."
            echo "Cut a patch release (it rebuilds the image with the updates), after merging any pending Dependabot PRs."
            echo
            echo "Scan run: $RUN_URL"
            echo
            echo '```'
            head -c 60000 trivy.txt
            echo '```'
          } > body.md
          gh label create security --color B60205 --description 'Security' 2>/dev/null || true
          existing=$(gh issue list --state open --label security --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file body.md
          else
            gh issue create --title "$title" --label security --body-file body.md
          fi
      - if: steps.trivy.outcome == 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title='Published Docker image has fixable vulnerabilities'
          existing=$(gh issue list --state open --label security --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue close "$existing" --comment "The scan of \`pepebits/ghost-connector:latest\` is clean again: $RUN_URL"
          fi
