# Release: bump "version" in package.json, add its section to CHANGELOG.md,
# then push an annotated tag (git tag -a v1.2.3) and this runs the
# checks, publishes the Docker image to Docker Hub and GHCR, creates the GitHub release
# from the tag's message and announces it on Telegram.
#
# Re-announce an existing release by hand (Actions → Release → Run
# workflow), with dry_run on to only print the message.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v1.2.3
        required: true
      chat:
        type: choice
        options: [test, announcements]
        default: test
      dry_run:
        type: boolean
        default: true

permissions:
  contents: read

# Actions are pinned by commit SHA (the jobs below hold registry credentials);
# Dependabot or a manual bump updates them.
jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      # The tag names the image; package.json is what the panel shows; the
      # changelog section is the release notes. All three must agree.
      - name: Check the tag matches package.json and CHANGELOG.md
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then echo "::error::Tag $TAG does not match package.json version ($version)"; exit 1; fi
          if ! grep -qE "^## \[$version\]" CHANGELOG.md; then echo "::error::CHANGELOG.md has no '## [$version]' section"; exit 1; fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Docker Hub: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token with
      # read/write on the repository), usually as organization secrets.
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: |
            pepebits/ghost-connector
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      # Scan before publishing: stop on any HIGH/CRITICAL vulnerability that has a fix.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ghost-connector:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghost-connector:scan
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # A bill of materials and a build provenance attestation, attached to the image.
          sbom: true
          provenance: mode=max
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # Docker Hub overview and short description, from docs/dockerhub.md. It needs a
      # token allowed to edit the repository (read, write, delete): without one it
      # only warns, the release goes on (the images are already published).
      - continue-on-error: true
        uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: pepebits/ghost-connector
          short-description: AI subagents that finish, optimize (SEO) and illustrate your Ghost drafts. Never publishes.
          readme-filepath: docs/dockerhub.md

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # The notes are this version's section of CHANGELOG.md.
      - run: |
          version="${TAG#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {f=1; next} f && /^## / {exit} f && !/^\[[^]]+\]: / {print}' CHANGELOG.md > notes.md
          echo "" >> notes.md
          echo "**Full changelog**: [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/$TAG/CHANGELOG.md)" >> notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  announce:
    needs: github-release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.github-release.result == 'success')
    permissions:
      contents: read
    uses: Pepebits/release-announce/.github/workflows/announce.yml@995de24932883caf9ea520d1d9c51f1737ac4e7b # v1
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      chat: ${{ inputs.chat || 'announcements' }}
      dry_run: ${{ inputs.dry_run || false }}
      notes_source: changelog
      project_name: Ghost Connector
      install_title: 🐳 Docker image
      install_command: docker pull pepebits/ghost-connector:{version}
      buttons: >-
        [{"text": "📝 Changelog", "url": "{repo_url}/blob/{tag}/CHANGELOG.md"},
         {"text": "📖 Docs", "url": "{repo_url}#readme"},
         {"text": "🐳 Docker Hub", "url": "https://hub.docker.com/r/pepebits/ghost-connector/tags"}]
      footer: 🏷️ Also tagged {minor} and latest
    # Only what the announcement needs (never the registry credentials).
    secrets:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_TEST_CHAT_ID: ${{ secrets.TELEGRAM_TEST_CHAT_ID }}
