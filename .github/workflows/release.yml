# Release: push an annotated tag (git tag -a v1.2.3) and this runs the
# checks, publishes the Docker image to Docker Hub and GHCR, creates the GitHub release
# from the tag's message and announces it on Telegram.
#
# Re-announce an existing release by hand (Actions → Release → Run
# workflow), with dry_run on to only print the message.
name: Release

on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag, e.g. v1.2.3
        required: true
      chat:
        type: choice
        options: [test, announcements]
        default: test
      dry_run:
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  publish:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      # Docker Hub: DOCKERHUB_USERNAME and DOCKERHUB_TOKEN (an access token with
      # read/write on the repository), usually as organization secrets.
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            pepebits/ghost-connector
            ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The notes are the annotated tag's message (subject, blank line, body).
      - run: |
          git tag -l --format='%(contents)' "$TAG" > notes.md
          gh release create "$TAG" --title "$TAG" --notes-file notes.md --verify-tag
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  announce:
    needs: github-release
    if: always() && (github.event_name == 'workflow_dispatch' || needs.github-release.result == 'success')
    permissions:
      contents: read
    uses: Pepebits/release-announce/.github/workflows/announce.yml@v1
    with:
      tag: ${{ inputs.tag || github.ref_name }}
      chat: ${{ inputs.chat || 'announcements' }}
      dry_run: ${{ inputs.dry_run || false }}
      notes_source: tag
      project_name: Ghost Connector
      install_title: 🐳 Docker image
      install_command: docker pull pepebits/ghost-connector:{version}
      buttons: >-
        [{"text": "📝 Notes", "url": "{repo_url}/releases/tag/{tag}"},
         {"text": "📖 Docs", "url": "{repo_url}#readme"},
         {"text": "🐳 Docker Hub", "url": "https://hub.docker.com/r/pepebits/ghost-connector/tags"}]
      footer: 🏷️ Also tagged {minor} and latest
    secrets: inherit
