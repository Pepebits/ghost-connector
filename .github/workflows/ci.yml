# Every pull request (Dependabot's included) and every push to main: type
# check, tests, build, and the Docker image built and scanned with Trivy.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: ghost-connector:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The image must start and answer its health check.
      - run: |
          mkdir -p data && chmod 777 data
          # Dummy settings: the panel only has to start (nothing calls Ghost or the AI here).
          printf 'GHOST_API_URL=https://example.com\nGHOST_ADMIN_API_KEY=%s:%s\nAI_API_KEY=ci-dummy\n' "$(printf 'a%.0s' $(seq 24))" "$(printf 'b%.0s' $(seq 64))" > data/config.env
          docker run -d --name gc -v "$PWD/data:/data" -p 127.0.0.1:4300:4300 ghost-connector:ci
          for _ in $(seq 1 30); do curl -fs http://127.0.0.1:4300/healthz && exit 0; sleep 2; done
          docker logs gc; exit 1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ghost-connector:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'
