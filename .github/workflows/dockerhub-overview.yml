# Releases update the Docker Hub overview from docs/dockerhub.md, so it always
# matches the published image. This runs it by hand (Actions → Docker Hub
# overview → Run workflow), only to fix something without cutting a release.
# Needs DOCKERHUB_TOKEN allowed to edit the repository (read, write, delete).
name: Docker Hub overview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  overview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: peter-evans/dockerhub-description@1b9a80c056b620d92cedb9d9b5a223409c68ddfa # v5.0.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
          repository: pepebits/ghost-connector
          short-description: AI subagents that finish, optimize (SEO) and illustrate your Ghost drafts. Never publishes.
          readme-filepath: docs/dockerhub.md
